services:
  app:
    build:
      context: .
      dockerfile: DockerFile
      args:
        NOTION_TOKEN: ${NOTION_TOKEN}
        RESEND_API_KEY: ${RESEND_API_KEY}
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
